name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q fluxo-app.zip -d app

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        working-directory: app
        run: npm install

      - name: Crear proyecto Android
        working-directory: app
        run: npx cap add android

      - name: Generar iconos y splash
        working-directory: app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor "#e8f8fc" --splashBackgroundColor "#e8f8fc"

      - name: Sincronizar
        working-directory: app
        run: npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fluxo-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
